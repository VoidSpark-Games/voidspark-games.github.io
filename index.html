<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Voidspark — our website is coming soon.">
    <meta name="theme-color" content="#0b0d16">
    <title>Voidspark — Coming Soon</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0d16;
        color: #f4f5fb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(ellipse at top, #242044 0%, #0b0d16 65%);
      }

      main {
        width: 100%;
        max-width: 44rem;
        text-align: center;
      }

      .eyebrow {
        color: #b9a3ff;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 1rem 0;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
      }

      .description {
        margin: 0;
        color: #b8bed0;
        font-size: 1.125rem;
        line-height: 1.7;
      }

      .accent {
        width: 3rem;
        height: 3px;
        margin: 2rem auto;
        border-radius: 3px;
        background: #b9a3ff;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Coming soon</p>
      <h1>Voidspark</h1>
      <div class="accent" aria-hidden="true"></div>
      <p class="description">Our website is taking shape.<br>Check back soon for more.</p>
      <footer class="home-footer">
        <a href="privacy-policy.html">Privacy Policy</a>
        <span aria-hidden="true">&middot;</span>
        <a href="mailto:contact@voidspark.games">Contact</a>
      </footer>
    </main>
  </body>
</html>
